<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Konversi Suhu Fahri</title>

    <!-- CSS External -->
     <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header Content -->
    <header></header>

    <!-- Main Content-->
     <main>
        <!-- Introduction -->
         <section>
            Berikut ini merupakan Website Konversi suhu
        </section>

         <!-- Form Konversi Suhu-->
          <form>
            <div>
                <label for="konversi-input">Celcius (&deg;C):</label>
            </div>

            <div>
                <textarea id="konversi-input"></textarea>
            </div>

            <!-- Form Action -->
            <div>
                <button>Konversi</button>
                <button>Reset</button>
                <button>Reverse</button>
            </div>  
          </form>

        <!-- Hasil Konversi Suhu -->
         <section>
            <div>
                <label for="result-input">Fahrenhet (&deg;F):</label>
            </div>

            <div>
                <textarea id="result-input" readonly></textarea>
            </div>
         </section>

        <!-- Penjelasan -->
         <section>
            <div>
                <label for="calculate-detail">Cara Kalkulasi:</label>
            </div>

            <div>
                <textarea id="calculate-detail" readonly></textarea>
            </div>
         </section>

        <!-- Informasi Tambahan -->
         <section>
            <header>
                <h1>Cara Konversi Dari (&deg;C) ke Fahrenheit (&deg;F)</h1>
            </header>

            <hr/>

            <article>
                <!-- Konten Informasi -->
                <p>Suhu <span class="formula">S</span> dalam derajat Fahrenheit (&deg;F)</p>

                <!-- Formula -->
                <div class="formula">
                    S<sub>(&deg;F)</sub> = (S<sub>(&deg;C)</sub> x 9/5) + 32
                </div>
                <div>
                    atau
                </div>

                <div class="formula">
                    S<sub>(&deg;F)</sub> = (S<sub>(&deg;C)</sub> x 1,8) + 32
                </div>
            </article>

         </section>
         <br/>
     </main>

     <!-- Footer Content-->
      <footer>
        Copyright &#169; Fahrial Akmal - Revo U Fundamental Course 2025
      </footer>
</body>
</html>
